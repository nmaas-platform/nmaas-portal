import com.github.gradle.node.npm.task.NpmTask

plugins {
    id "com.github.node-gradle.node" version "7.1.0"
    id "org.sonarqube" version "7.3.1.8318"
}

version = '1.11.0-SNAPSHOT'

def buildGUI = tasks.register('buildGUI', NpmTask) {
    group = 'build'
    description = 'Builds the Angular application.'
    dependsOn(tasks.named('npmInstall'))
    args.set(['run', 'ng', '--', 'build', '--base-href', '/'])
}

def buildGUIprod = tasks.register('buildGUIprod', NpmTask) {
    group = 'build'
    description = 'Builds the Angular application for production.'
    dependsOn(tasks.named('npmInstall'))
    args.set(['run', 'ng', '--', 'build', '--base-href', '/', '--configuration', 'production'])
}

def testCoverage = tasks.register('testCoverage', NpmTask) {
    group = 'verification'
    description = 'Runs Angular tests with code coverage.'
    dependsOn(tasks.named('npmInstall'))
    args.set(['run', 'test', '--', '--browsers', 'Chromium', '--watch=false', '--code-coverage', '--source-map=false'])
}

def dist = tasks.register('dist', Zip) {
    group = 'build'
    description = 'Packages the Angular build output.'
    dependsOn(project.hasProperty('prod') ? buildGUIprod : buildGUI)
    from('build/app')
    archiveBaseName.set(project.name)
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
}

tasks.register('build') {
    group = 'build'
    description = 'Builds, tests, and packages the project.'
    dependsOn(dist, testCoverage)
}

sonar {
    properties {
        property "sonar.sources", "src"
        property "sonar.exclusions", ["**/node_modules/**", "**/*.spec.ts", "**/bootstrap.js", "**/src/app/service/**", "**/src/app/model/**"]
        property "sonar.tests", "src"
        property "sonar.test.inclusions", "**/*.spec.ts"
        property "sonar.typescript.lcov.reportPaths", "coverage/lcov.info"
        property "sonar.projectVersion", project.version.toString()
    }
}

tasks.named('sonar') {
    dependsOn(testCoverage)
}
