stages:
  - test
  - sonar
  - build
  - mend

test:
  stage: test
  image: trion/ng-cli-karma:21.2.14
  script:
    - npm ci --legacy-peer-deps
    - ng build
    - ng test --code-coverage --watch=false --browsers=Chrome
  coverage: '/Lines.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - coverage/

sonar:
  stage: sonar
  image: trion/ng-cli:21.2.14
  only:
    - develop
    - /^release/
  script:
    - npm ci --legacy-peer-deps
    - npm run sonar -- -Dsonar.host.url=${SONAR_HOST} -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.projectName=${SONAR_PROJECT_NAME} -Dsonar.branch.name=develop -Dsonar.login=${SONAR_LOGIN_TOKEN}

build_and_push_latest_image:
  stage: build
  image: korvoj/docker-git:29.6.0
  only:
    - develop
  variables:
    IMAGE_TAG: "latest"
  script:
    - |
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

build_and_push_alfa_image:
  stage: build
  image: korvoj/docker-git:29.6.0
  only:
    - /^release/
  script:
    - |
      export IMAGE_TAG=$(echo $CI_COMMIT_BRANCH | cut -c 9-)-alfa
      docker image prune -f
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

build_and_push_release_image:
  stage: build
  image: korvoj/docker-git:29.6.0
  only:
    - tags
  script:
    - |
      export IMAGE_TAG=$(echo $CI_COMMIT_TAG | cut -c 2-)
      docker image prune -f
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

mend:
  stage: mend
  image: eclipse-temurin:21.0.11_10-jdk-jammy
  only:
    - /^release/
  variables:
    PRODUCT_NAME: "nmaas"
    PROJECT_NAME: "nmaas-portal"
  script:
    - |
      export PRODUCT_VERSION=$(echo $CI_COMMIT_BRANCH | cut -c 9-)
      export PROJECT_VERSION=$PRODUCT_VERSION
      apt-get update && apt-get install -y curl ca-certificates gnupg
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      echo "node version : $(node -v)"
      echo "npm version : $(npm -v)"
      npm install -g @angular/cli
      npm ci --legacy-peer-deps
      chmod +x ./gradlew
      curl -LJO https://github.com/whitesource/unified-agent-distribution/releases/latest/download/wss-unified-agent.jar
      java -jar wss-unified-agent.jar -userKey ${MEND_USER_KEY} -apiKey ${MEND_API_KEY} -projectVersion ${PROJECT_VERSION} -project ${PROJECT_NAME} -productVersion ${PRODUCT_VERSION} -product ${PRODUCT_NAME} -c ./ws/ws.config -d ./
