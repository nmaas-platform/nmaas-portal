<h4 class="header">{{ 'BUNDLES.TITLE' | translate }}</h4>
<div style="display: flex; align-items: center;  margin-top:20px">
    <div style="margin-right:20px">
        <p-iconfield class="p-input-icon-right" style="width: 100%">
            <input pInputText type="text" name="search" class="form-control" style="width: 100%"
                   (keyup)="onSearchValueChange($event.target.value)" (ngModelChange)="applyFilter()"
                   [(ngModel)]="searchValue"
                   placeholder="{{'SEARCH' | translate}}"/>
            <p-inputicon class="pi pi-search" style="font-size: 13px;"></p-inputicon>
        </p-iconfield>
    </div>
    <div class="flex" style="margin-right:20px">
        <button *roles="['ROLE_SYSTEM_ADMIN', 'ROLE_GROUP_MANAGER']"
                [routerLink]="['create']" class="btn btn-primary"
                role="button">{{ 'BUNDLES.ADD_BUTTON' | translate }}
        </button>
    </div>
</div>
<div class="background-section">
    <p-table [value]="bundles" [lazy]="true" (onLazyLoad)="onTableLazyLoad($event)"
             [totalRecords]="paginationSettings.totalElements" [rows]="paginationSettings.maxItemsOnPage"
             [rowsPerPageOptions]="[15,20,25,50]" [paginator]="true" [loading]="loading"
             [sortField]="paginationSettings.sortField" [sortOrder]="paginationSettings.sortOrder === 'asc' ? 1 : -1">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="codename">
                    {{ 'BUNDLES.CODENAME' | translate }}
                    <p-sortIcon field="codeName"></p-sortIcon>
                </th>
                <th pSortableColumn="name">
                    {{ 'BUNDLES.NAME' | translate }}
                    <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th style="width: 20%">
                    {{ 'BUNDLES.QUANTITY' | translate }}
                </th>
                <th pSortableColumn="active">
                    {{ 'BUNDLES.DESCRIPTION' | translate }}
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-bundle>
                <tr>
                    <td [routerLink]="['view/', bundle.id]">{{ bundle?.codeName }}</td>
                    <td [routerLink]="['view/', bundle.id]">{{ bundle?.name }}</td>
                    <td [routerLink]="['view/', bundle.id]">{{bundle?.apps.length}}</td>
                    <td [routerLink]="['view/', bundle.id]">{{getDescription(bundle).briefDescription}}</td>
                    <td class="text-right">
                        <button type="button" *roles="['ROLE_SYSTEM_ADMIN', 'ROLE_OPERATOR', 'ROLE_GROUP_MANAGER']"
                                class="dropdown-button"
                                (click)="openRowMenu($event, bundle)">
                            <i class="pi pi-cog" style="font-size: 1.4rem; color: var(--p-text-0)"></i>
                        </button>
                        <p-menu #rowMenu [popup]="true" appendTo="body" [model]="rowMenuItems"></p-menu>
                    </td>
                </tr>

        </ng-template>
    </p-table>
</div>
