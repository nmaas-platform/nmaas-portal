<h4 class="header">{{'DOMAINS.LIST.GROUPS' | translate}}</h4>
<div style="display: flex; align-items: center;  margin-top:20px">
    <div style="margin-right:20px">
        <p-iconfield  class="p-input-icon-right" style="width: 100%">
            <input pInputText class="flex form-control" name="search" id="search" placeholder="Search" type="text" style="height: 34px" [(ngModel)]="searchValue">
            <p-inputicon  class="pi pi-search" style="font-size: 13px;"/>
        </p-iconfield>
    </div>
    <div class="flex" style="margin-right:20px">
        <button *roles="['ROLE_SYSTEM_ADMIN','ROLE_GROUP_MANAGER']" [routerLink]="['/admin/domains/groups/add']" class="btn btn-primary"
       role="button">{{'DOMAINS.ADD_BUTTON' | translate}}</button>
    </div>
</div>


<div class="background-section">

    <p-table [value]="groups | searchDomainGroup: searchValue" [lazy]="true" (onLazyLoad)="onTableLazyLoad($event)"
    [totalRecords]="paginationSettings.totalElements" [rows]="paginationSettings.maxItemsOnPage"
    [rowsPerPageOptions]="[15,20,25,50]" paginator="true" [loading]="loading"
    [sortField]="paginationSettings.sortField" [sortOrder]="paginationSettings.sortOrder === 'asc' ? 1 : -1">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="codenam">{{'DOMAINS.CODE_NAME' | translate}}
                    <p-sortIcon field="codename"></p-sortIcon>
                </th>
                <th pSortableColumn="name">{{'APPS_MANAGEMENT.NAME' | translate}}
                    <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="numberOfDomains">
                    {{'DOMAINS.NUMBER_OF_DOMAINS' | translate}}
                    <p-sortIcon fiels="numberOfDomains"></p-sortIcon>
                </th>
                <th></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-domainGroup let-i="rowIndex">
            <tr class="table-row">
                <td style="width: 30%" [routerLink]="['view/', domainGroup.id]">{{domainGroup?.codename}}</td>
                <td style="width: 30%" [routerLink]="['view/', domainGroup.id]" >{{domainGroup?.name}}</td>
                <td style="width: 30%" [routerLink]="['view/', domainGroup.id]">{{domainGroup.domains.length}}</td>
<!--                <td style="width: 20%" class="text-right">-->
<!--                    <span class="dropdown">-->

<!--                        </a>-->

<!--                                <a [routerLink]="['/admin/domains/groups/', domainGroup?.id]">{{ 'APPS_MANAGEMENT.EDIT_BUTTON' | translate }}</a>-->
<!--                            </li>-->
<!--                            <li>-->
<!--                                <a (click)="deleteDomainGroup(domainGroup?.id)">{{ 'APP_INSTANCE.REMOVE_BUTTON' | translate }}</a>-->
<!--                            </li>-->
<!--                        </ul>-->
<!--                    </span>-->
<!--                </td>-->
                <td class="text-right">
                    <button type="button"
                            class="dropdown-button"
                            (click)="openRowMenu($event, domainGroup)">
                        <i class="pi pi-cog" style="font-size: 1.4rem; color: var(--p-text-0)"></i>
                    </button>
                    <p-menu #rowMenu [popup]="true" appendTo="body" [model]="rowMenuItems"></p-menu>
                </td>
            </tr>

        </ng-template>
    </p-table>
</div>
