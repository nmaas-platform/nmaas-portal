<p-tabs value="0">
    <p-tablist>
        <p-tab value="0">{{'DOMAINS.ANNOTATIONS.HEADER' | translate}}</p-tab>
        <p-tab value="1">Domain resource limits</p-tab>
    </p-tablist>
    <p-tabpanels>
        <p-tabpanel value="0">
            <app-domain-annotations></app-domain-annotations>
        </p-tabpanel>
        <p-tabpanel value="1">
            <div class="panel-body">
                <form class="form-horizontal" #limitForm="ngForm" (submit)="save()">
                    <div class="panel-body">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="memory">memory</label>
                            <div class="col-sm-9 pd-top-7">
                                <div class="input-width">
                                    <input class="col-sm-9 pd-top-7 " [(ngModel)]="globalResourcesLimit.memory"
                                           placeholder="Not set" pInputText id="memory" name="memory"
                                           type="number" required/>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="cpu">cpu</label>
                            <div class="col-sm-9 pd-top-7">
                                <div class="input-width">
                                    <input class="col-sm-9 pd-top-7" [(ngModel)]="globalResourcesLimit.cpu"
                                           placeholder="Not set" pInputText id="cpu" name="cpu"
                                           type="number" required/>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="instancesNo">instancesNo</label>
                            <div class="col-sm-9 pd-top-7">
                                <div class="input-width">
                                    <input class="col-sm-9 pd-top-7" [(ngModel)]="globalResourcesLimit.instancesNo"
                                           placeholder="Not set" pInputText id="instancesNo" name="instancesNo"
                                           type="number" required/>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="containersNo">containersNo</label>
                            <div class="col-sm-9 pd-top-7">
                                <div class="input-width">
                                    <input class="col-sm-9 pd-top-7" [(ngModel)]="globalResourcesLimit.containersNo"
                                           placeholder="Not set" pInputText id="containersNo" name="containersNo"
                                           type="number" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-content-end">
                        <button class="btn btn-primary" type="submit"  [disabled]="!limitForm.valid">
                            {{ 'PORTAL_CONFIGURATION.SUBMIT_BUTTON' | translate }}
                        </button>
                    </div>
                </form>
            </div>

        </p-tabpanel>
    </p-tabpanels>

</p-tabs>
