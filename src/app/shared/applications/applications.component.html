
<div class="col-12" style="display: flex; align-items: flex-end; flex-wrap: wrap; padding: 0">
  <div class="sm:col-12 md:col-12 lg:col-4 xl:col-3 " style="padding-left:0">
    <nmaas-inline-search [value]="searchedAppName"
    (changed)="filterAppsByName($event)"></nmaas-inline-search>
  </div>

  <div class="sm:col-12 md:col-12 lg:col-4 xl:col-3 ">
    <nmaas-tag-filter (changed)="filterAppsByTag($event)"></nmaas-tag-filter>
  </div>
  <div class="sm:col-12 md:col-12 lg:col-4 xl:col-3  form-inline">
    <div class="form-group" style="width: 100%">
      <label for="sortMode" style="margin-right: 6px; color: var(--p-text-0)" >{{'APP_INSTANCES.SORT' | translate}}</label>
      <select id="sortMode" name="sortMode" class="form-control" [(ngModel)]="sortMode" (ngModelChange)="onSort()"
        style="width: 100%; background: var(--p-surface-300); border: 1px solid var(--p-accent-600); color:var(--p-text-0)">
        @for (opt of sortModeList; track opt) {
          <option [value]="opt">{{('APP_INSTANCES.SORT_MODE.' + opt) | translate}}</option>
        }
      </select>
    </div>
  </div>
  <div  class="sm:col-12 md:col-12 lg:col-4 xl:col-3  form-group" style="padding: 15px; display: flex">
    <p-checkbox
      inputId="subscribed"
      binary="true"
      [(ngModel)]="showSubscribed"
      [ngModelOptions]="{standalone: true}"
      id="subscribed"
      ngDefaultControl/>
      <label style="margin: 0; padding-left: 5px; font-weight: unset; text-wrap: nowrap; color: var(--p-text-0)" for="subscribed">Show subscribed only</label>
    </div>
</div>


<nmaas-applist [appView]="appView" [listType]="selectedListType"
               [showSubscribed]="showSubscribed" [applications]="applications"
               [selected]="selected" [domainId]="domainId" [domain]="domain"></nmaas-applist>
