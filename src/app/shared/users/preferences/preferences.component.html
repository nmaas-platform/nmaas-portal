<div style="padding-bottom: 15px;" class="background-section">
  <div style="display: flex; justify-content:space-between">
    <h4  style="font-size:15px; font-weight: bold">{{'USER_DETAILS.PREFERENCES' | translate}}</h4>
    <!--        <button *ngIf="isInMode(ComponentMode.VIEW) && isModeAllowed(ComponentMode.EDIT)" type="button"-->
  <!--                class="btn btn-text" (click)="onModeChange()">{{'USER_DETAILS.EDIT_BUTTON' | translate}}</button>-->
</div>

<div class="panel-body" style="display: flex; flex-direction: column">
  <div class="form-group">

  </div>

  @if (user) {
    <form  class="form-horizontal" #userPreferencesForm="ngForm">
      <div class="form-group" >
        <label for="defaultDomain" class="col-sm-2 control-label">{{'USER_DETAILS.DEFAULT_DOMAIN' | translate}}:</label>
        <div class="col-sm-10">
          <select style="background: var(--p-surface-300); border: 1px solid var(--p-accent-600); color: var(--p-text-0);" class="form-control" id="defaultDomain" name="defaultDomain" #defaultDomain="ngModel"
            [(ngModel)]="user.defaultDomain"  (ngModelChange)="submit()" >
            <option [ngValue]="null">None</option>
            @for (role of getFilteredUserRoles(); track role) {
              <option [ngValue]="role.domainId">{{getNameForDomain(role.domainId)}}</option>
            }
          </select>
        </div>
      </div>
      <div  class="form-group">
        <label class="col-sm-2 control-label" style="text-align: end" for="language">{{ 'LANGUAGE_MANAGEMENT.LANGUAGE' | translate }}: </label>
        <div class="col-sm-10">
          <p-select
            [options]="languages"
            [(ngModel)]="user.selectedLanguage"
            (ngModelChange)="setLanguage($event)"
            optionLabel="name"
            placeholder="Select a Country"
            [ngModelOptions]="{standalone: true}"
            ngDefaultControl>
            <ng-template #selectedItem let-selectedOption>
              <div class="flex items-center gap-2">
                <img src="assets/images/country/{{selectedOption}}_circle.png"  style="width: 40px" />
                <div>{{ selectedOption.toUpperCase() }}</div>
              </div>
            </ng-template>
            <ng-template let-lang #item>
              <div class="flex items-center gap-2">
                <img src="assets/images/country/{{lang}}_circle.png" style="width: 40px" />
                <div>{{ lang.toUpperCase() }}</div>
              </div>
            </ng-template>
          </p-select>
        </div>
        <!--                <div class="col-sm-3" name="language" class="dropdown">-->
        <!--                    <a style="display: inline-block" class="dropdown-toggle dropdown-lang" aria-expanded="false" aria-haspopup="true"-->
        <!--                       data-toggle="dropdown" href="#" role="button">-->
        <!--                        <img alt="language" class="lang-circle-icon" style="width:60px" src="{{[getPathToCurrent()]}}"/>-->
      <!--                    </a>-->
      <!--                    <ul class="dropdown-menu">-->
      <!--                        <li *ngFor="let lang of languages" [ngClass]="{'active': lang === user?.selectedLanguage}">-->
      <!--                            <a (click)="setLanguage(lang)">-->
      <!--                                <img alt="lang flag" class="lang-circle-icon" style="width: 60px"-->
      <!--                                     src="assets/images/country/{{lang}}_circle.png"/>-->
      <!--                                <span>{{lang.toUpperCase()}}</span>-->
    <!--                            </a>-->
  <!--                        </li>-->
<!--                    </ul>-->
<!--                </div>-->
</div>
<div class="form-group">
  <label class="col-sm-2 control-label" style="text-align: end" for="mode">Mode: </label>
  <div class="col-sm-10">
    <p-selectButton
      ngDefaultControl
      [options]="themeOptions"
      [(ngModel)]="selectedTheme"
      [ngModelOptions]="{standalone: true}"
      optionLabel="label"
      optionValue="value"
      (onChange)="onThemeChange($event)"
      aria-labelledby="theme-selector">
    </p-selectButton>
  </div>
</div>
<div class="flex justify-content-end mb-4">
  @if (!isInMode(ComponentMode.VIEW)) {
    <button type="button" style="margin-right:10px"
    class="btn btn-secondary" (click)="onModeChange()">{{'USER_DETAILS.VIEW_BUTTON' | translate}}</button>
  }
  @if (!isInMode(ComponentMode.VIEW)) {
    <button type="submit" [disabled]="userPreferencesForm.invalid"
    class="btn btn-primary">{{'USER_DETAILS.SUBMIT_BUTTON' | translate}}</button>
  }
</div>
</form>
}
</div>
</div>
