<div style="padding-bottom: 15px;" class="background-section">

    <div style="display: flex; justify-content:space-between">
        <h4 style="font-size:15px; font-weight: bold" >{{'SSH_KEYS.HEADER' | translate}}</h4>
        <app-new-ssh-key [userMode]="userMode" [userId]="userId" (out)="getData()"></app-new-ssh-key>
    </div>
    <div class="panel-body">

        <table class="table table-hover" aria-describedby="User ssh keys table">
            <thead>
            <tr>
                <th scope="col">{{'SSH_KEYS.TABLE.NAME' | translate}}</th>
                <th scope="col">{{'SSH_KEYS.TABLE.FINGERPRINT' | translate}}</th>
                <th scope="col">{{'SSH_KEYS.TABLE.ACTIONS' | translate}}</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let key of keysList">
                <td>{{key.name}}</td>
                <td>{{key.fingerprint}}</td>
                <td>
                    <button type="button" class="btn btn-danger" (click)="invalidate(key.id)">{{'SSH_KEYS.BUTTON_INVALIDATE' | translate}}</button>
                </td>
            </tr>
            <tr *ngIf="keysList.length === 0">
              <td colspan="3" style="text-align: center">{{'SSH_KEYS.NO_KEYS' | translate}}</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
